[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-change-monitor"
version = "0.1.0"
description = "Read-only change monitoring for a warehouse database: Python agent with an offline queue, FastAPI ingest API and a live dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Tahar Ababsa" }]
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mssql = ["pymssql>=2.3"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
depot-agent = "depot_monitor.agent.main:main"
depot-simulator = "depot_monitor.demo.simulator:main"

# Hosted live demo (Vercel): the whole pipeline in one process, see src/depot_monitor/demo/web.py
[tool.vercel]
entrypoint = "src.depot_monitor.demo.web:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depot_monitor = ["api/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real SQL Server (set MSSQL_ADMIN_URL)"]
filterwarnings = [
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults
