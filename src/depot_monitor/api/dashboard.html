<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depot change monitor</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --line: #e1e0d9; --axis: #c3c2b7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --insert: #1baf7a; --update: #2a78d6; --delete: #eb6834;
    --good: #0ca30c; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --line: #2c2c2a; --axis: #383835;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --insert: #199e70; --update: #3987e5; --delete: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--ink-2);
       text-transform: uppercase; letter-spacing: 0.06em; }
  .agents { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .agent { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
           background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
  .agent b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .agent.offline .dot { background: transparent; border: 2px solid var(--critical); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px;
                 font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--muted); font-size: 12px; }
  .bars { margin-bottom: 12px; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
  .legend i, .op i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .row { display: grid; grid-template-columns: 150px 1fr 220px; align-items: center; gap: 14px; padding: 5px 0; }
  .row .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { display: flex; gap: 2px; height: 14px; }
  .seg { height: 100%; min-width: 3px; border-radius: 4px; }
  .seg:hover { filter: brightness(1.12); }
  .row .nums { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
  .c-insert { background: var(--insert); } .c-update { background: var(--update); } .c-delete { background: var(--delete); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .filters h2 { margin: 0 auto 0 0; }
  select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
                   border-radius: 8px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 10px;
       border-bottom: 1px solid var(--axis); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.time { white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .op { display: inline-flex; align-items: center; white-space: nowrap; font-size: 12.5px; }
  .diff span { display: inline-block; margin: 0 12px 2px 0; }
  .diff .f { color: var(--ink-2); } .diff .old { color: var(--muted); text-decoration: line-through; }
  .empty { color: var(--muted); padding: 28px 10px; text-align: center; }
  .more { margin-top: 12px; text-align: center; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); padding: 5px 9px;
         border-radius: 6px; font-size: 12.5px; display: none; z-index: 5; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  @media (max-width: 700px) { .row { grid-template-columns: 110px 1fr; } .row .nums { grid-column: 1 / -1; text-align: left; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Depot change monitor</h1>
    <div class="agents" id="agents" aria-label="Agents"></div>
  </header>

  <section class="tiles" aria-label="Summary">
    <div class="card tile"><div class="label">Changes recorded</div><div class="value" id="t-total">–</div><div class="hint">since monitoring started</div></div>
    <div class="card tile"><div class="label">Last 24 hours</div><div class="value" id="t-24h">–</div><div class="hint">changes detected</div></div>
    <div class="card tile"><div class="label">Last change</div><div class="value" id="t-last">–</div><div class="hint" id="t-last-hint">&nbsp;</div></div>
    <div class="card tile"><div class="label">Waiting at the depot</div><div class="value" id="t-pending">–</div><div class="hint">events queued, not yet sent</div></div>
  </section>

  <section class="card bars" aria-label="Changes by table">
    <h2>Changes by table</h2>
    <div class="legend">
      <span><i class="c-insert"></i>insert</span><span><i class="c-update"></i>update</span><span><i class="c-delete"></i>delete</span>
    </div>
    <div id="bars"></div>
  </section>

  <section class="card" aria-label="Latest changes">
    <div class="filters">
      <h2>Latest changes</h2>
      <label>Table <select id="f-table"><option value="">All</option></select></label>
      <label>Operation <select id="f-op"><option value="">All</option><option>insert</option><option>update</option><option>delete</option></select></label>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Detected</th><th>Table</th><th>Operation</th><th>Row key</th><th>What changed</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </div>
    <div class="more"><button id="more" hidden>Load older changes</button></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en");
const show = (v) => (v === null || v === undefined ? "∅" : String(v));
const OPS = ["insert", "update", "delete"];
const PAGE = 50;
let oldestId = null;

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + " s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
const clock = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });

function describe(e) {
  if (e.op === "update") {
    return e.changed_fields.map((f) =>
      `<span><span class="f">${esc(f)}:</span> <span class="old">${esc(show(e.before[f]))}</span> → <b>${esc(show(e.after[f]))}</b></span>`).join("");
  }
  const row = e.op === "insert" ? e.after : e.before;
  const rest = Object.keys(row).filter((k) => !(k in e.key)).slice(0, 5);
  return rest.map((k) => `<span><span class="f">${esc(k)}:</span> ${esc(show(row[k]))}</span>`).join("");
}

function eventRow(e) {
  const key = Object.entries(e.key).map(([k, v]) => `${esc(k)}=${esc(show(v))}`).join(", ");
  return `<tr><td class="time" title="${esc(e.detected_at)}">${esc(clock(e.detected_at))}</td>
    <td class="mono">${esc(e.table)}</td>
    <td><span class="op"><i class="c-${e.op}"></i>${e.op}</span></td>
    <td class="mono">${key}</td><td class="diff mono">${describe(e)}</td></tr>`;
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " → HTTP " + r.status);
  return r.json();
}

function query(extra) {
  const p = new URLSearchParams({ limit: PAGE, ...extra });
  if ($("f-table").value) p.set("table", $("f-table").value);
  if ($("f-op").value) p.set("op", $("f-op").value);
  return "/api/v1/events?" + p;
}

async function loadStats() {
  const s = await getJSON("/api/v1/stats");
  $("t-total").textContent = fmt(s.total);
  $("t-24h").textContent = fmt(s.last_24h);
  $("t-last").textContent = s.last_event_at ? ago(s.last_event_at) : "–";
  $("t-last-hint").textContent = s.last_event_at ? clock(s.last_event_at) : "no change recorded yet";
  $("t-pending").textContent = fmt(s.agents.reduce((n, a) => n + a.pending, 0));

  $("agents").innerHTML = s.agents.map((a) =>
    `<span class="agent ${a.online ? "" : "offline"}"><span class="dot"></span><b>${esc(a.source)}</b>
     ${a.online ? "online" : "offline"} · seen ${esc(ago(a.last_seen))}</span>`).join("")
    || `<span class="agent offline"><span class="dot"></span>no agent has reported yet</span>`;

  const max = Math.max(1, ...s.by_table.map((t) => t.insert + t.update + t.delete));
  $("bars").innerHTML = s.by_table.map((t) => {
    const total = t.insert + t.update + t.delete;
    const segs = OPS.filter((op) => t[op] > 0).map((op) =>
      `<div class="seg c-${op}" style="flex:${t[op]}" data-tip="${esc(t.table)} · ${fmt(t[op])} ${op}${t[op] === 1 ? "" : "s"}"></div>`).join("");
    return `<div class="row"><div class="name" title="${esc(t.table)}">${esc(t.table)}</div>
      <div class="track" style="width:${Math.max(2, (100 * total) / max)}%">${segs}</div>
      <div class="nums">${fmt(t.insert)} insert · ${fmt(t.update)} update · ${fmt(t.delete)} delete</div></div>`;
  }).join("") || `<div class="empty">No change recorded yet.</div>`;

  const select = $("f-table"), current = select.value;
  const names = s.by_table.map((t) => t.table);
  if (names.join() !== [...select.options].slice(1).map((o) => o.value).join()) {
    select.innerHTML = `<option value="">All</option>` + names.map((n) => `<option>${esc(n)}</option>`).join("");
    select.value = names.includes(current) ? current : "";
  }
}

async function loadEvents() {
  const events = await getJSON(query({}));
  $("events").innerHTML = events.map(eventRow).join("")
    || `<tr><td colspan="5" class="empty">No change matches these filters yet.</td></tr>`;
  oldestId = events.length ? events[events.length - 1].id : null;
  $("more").hidden = events.length < PAGE;
}

async function loadOlder() {
  if (oldestId === null) return;
  const events = await getJSON(query({ before_id: oldestId }));
  $("events").insertAdjacentHTML("beforeend", events.map(eventRow).join(""));
  if (events.length) oldestId = events[events.length - 1].id;
  $("more").hidden = events.length < PAGE;
  paused = true; // keep the older rows on screen instead of refreshing them away
}

let paused = false;
async function refresh() {
  try { await loadStats(); if (!paused) await loadEvents(); } catch (err) { console.error(err); }
}
for (const id of ["f-table", "f-op"]) $(id).addEventListener("change", () => { paused = false; loadEvents(); });
$("more").addEventListener("click", loadOlder);

const tip = $("tip");
document.addEventListener("mousemove", (ev) => {
  const text = ev.target.dataset && ev.target.dataset.tip;
  if (!text) { tip.style.display = "none"; return; }
  tip.textContent = text; tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = ev.clientY - 34 + "px";
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
